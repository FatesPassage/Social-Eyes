name: Social Eyes Phase 1 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript parser for foundation tests
        run: |
          npm install --prefix /tmp/social-eyes-ci-parser --no-save --ignore-scripts --no-package-lock typescript@5.9.3
          mkdir -p node_modules
          ln -s /tmp/social-eyes-ci-parser/node_modules/typescript node_modules/typescript
      - name: JavaScript syntax
        run: |
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
      - name: Static integration smoke tests
        run: node tests/smoke.test.cjs
      - name: Phase 1 static audit
        run: npm run audit:static
      - name: Foundation regression tests
        run: npm run test:foundation
      - name: TypeScript source syntax audit
        run: npm run audit:syntax
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop avatar behavior
        run: node tests/browser.test.cjs
